<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCDF Admin — Login</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #fff;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 360px; max-width: 92vw; background: #151515; border: 1px solid #2a2a2a; border-radius: 12px; padding: 36px 30px; }
        .brand { font-family: 'Times New Roman', serif; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; color: #ff5a5a; margin-bottom: 4px; }
        h1 { font-family: 'Times New Roman', serif; font-weight: 400; font-size: 26px; margin: 0 0 22px; }
        label { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #aaa; margin: 14px 0 6px; }
        input[type=text], input[type=password] { width: 100%; padding: 11px 13px; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 14px; }
        input:focus { outline: none; border-color: #ff5a5a; }
        button { width: 100%; margin-top: 22px; padding: 12px; background: #ff5a5a; color: #fff; border: 0; border-radius: 6px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
        button:hover { background: #e23d3d; }
        .err { background: #2a0d0d; border: 1px solid #ff5a5a; color: #ffb3b3; padding: 9px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">PCIU Debating Forum</div>
        <h1>Admin Login</h1>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login">
            <label>Username</label>
            <input type="text" name="username" autofocus required>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Enter</button>
        </form>
    </div>
</body>
</html>
